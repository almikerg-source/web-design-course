<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food, LLC</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-default">
    <div class="container-fluid">
      <div class="navbar-header">

        <!-- Mobile menu button - only shows on mobile -->
        <button type="button" class="navbar-toggle collapsed visible-xs"
          data-toggle="collapse" data-target="#menu">
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
          <span class="icon-bar"></span>
        </button>

        <!-- Brand name on the left -->
        <a class="navbar-brand" href="#">Food, LLC</a>
      </div>

      <!-- Dropdown menu items -->
      <div class="collapse navbar-collapse" id="menu">
        <ul class="nav navbar-nav">
          <li><a class="text-center" href="#">Chicken</a></li>
          <li><a class="text-center" href="#">Beef</a></li>
          <li><a class="text-center" href="#">Sushi</a></li>
        </ul>
      </div>

    </div>
  </nav>

  <!-- PAGE HEADING -->
  <div class="container">
    <h1 class="text-center">Our Menu</h1>
  </div>

  <!-- MAIN SECTION -->
  <div class="container">
    <div class="row">
      <div class="col-xs-12 main-section">
        <p>Welcome to Food, LLC</p>
      </div>
    </div>
  </div>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
</body>
</html>
